name: Reshop
description: 'Reshop (Reshop US, Inc.) is a fintech company that provides instant refunds
  for e-commerce returns. When a shopper initiates a return at a partner retailer, Reshop
  pays out the refund immediately rather than making the customer wait for the item to
  ship back and be processed, delivering funds to the original payment method, a debit
  card, or a bank account. Reshop partners with clothing and lifestyle brands such as
  Volcom, RVCA, Vince Camuto, and Roxy, operates in the United States, and offers iOS
  and Android mobile apps. The company is backed by Matrix Partners. This profile was
  added to the API Evangelist network as a portfolio lead; Reshop publishes no public
  developer or API surface at this time.'
